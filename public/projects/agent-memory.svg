<svg xmlns="http://www.w3.org/2000/svg" viewBox="460 38 150 124" width="150" height="124" role="img" aria-label="Dense memory traces consolidating into a smaller structured graph">
  <defs>
    <linearGradient id="consolidate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Episodic traces: many, small, unstructured -->
  <g fill="#94a3b8">
    <circle cx="70" cy="98" r="3.2"/>
    <circle cx="88" cy="72" r="3.2"/>
    <circle cx="96" cy="122" r="3.2" opacity="0.75"/>
    <circle cx="112" cy="90" r="3.2"/>
    <circle cx="120" cy="142" r="3.2" opacity="0.6"/>
    <circle cx="134" cy="66" r="3.2" opacity="0.7"/>
    <circle cx="140" cy="106" r="3.2"/>
    <circle cx="150" cy="134" r="3.2" opacity="0.65"/>
    <circle cx="160" cy="80" r="3.2"/>
    <circle cx="172" cy="112" r="3.2" opacity="0.8"/>
    <circle cx="182" cy="94" r="3.2"/>
    <circle cx="78" cy="134" r="3.2" opacity="0.55"/>
    <circle cx="104" cy="152" r="3.2" opacity="0.5"/>
    <circle cx="128" cy="120" r="3.2" opacity="0.85"/>
    <circle cx="166" cy="146" r="3.2" opacity="0.45"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2" opacity="0.9">
    <line x1="88" y1="72" x2="112" y2="90"/>
    <line x1="112" y1="90" x2="140" y2="106"/>
    <line x1="140" y1="106" x2="160" y2="80"/>
    <line x1="140" y1="106" x2="150" y2="134"/>
    <line x1="96" y1="122" x2="120" y2="142"/>
  </g>

  <!-- Consolidation -->
  <g stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5">
    <line x1="204" y1="100" x2="252" y2="100" marker-end="url(#arrow)"/>
    <line x1="386" y1="100" x2="434" y2="100" marker-end="url(#arrow)"/>
  </g>

  <!-- Semantic memory: fewer nodes, some structure -->
  <g stroke="#cbd5e1" stroke-width="1.6">
    <line x1="286" y1="86" x2="316" y2="72"/>
    <line x1="286" y1="86" x2="304" y2="118"/>
    <line x1="316" y1="72" x2="344" y2="100"/>
    <line x1="304" y1="118" x2="344" y2="100"/>
    <line x1="304" y1="118" x2="350" y2="132"/>
  </g>
  <g fill="#64748b">
    <circle cx="286" cy="86" r="6.5"/>
    <circle cx="316" cy="72" r="6.5"/>
    <circle cx="304" cy="118" r="6.5"/>
    <circle cx="344" cy="100" r="6.5"/>
    <circle cx="350" cy="132" r="6.5"/>
  </g>

  <!-- Structured memory: few nodes, durable edges -->
  <g stroke="url(#consolidate)" stroke-width="3" stroke-linecap="round">
    <line x1="488" y1="96" x2="536" y2="70"/>
    <line x1="488" y1="96" x2="528" y2="132"/>
    <line x1="536" y1="70" x2="584" y2="98"/>
    <line x1="528" y1="132" x2="584" y2="98"/>
    <line x1="536" y1="70" x2="528" y2="132"/>
  </g>
  <g fill="#d97706">
    <circle cx="488" cy="96" r="9.5"/>
    <circle cx="536" cy="70" r="9.5"/>
    <circle cx="528" cy="132" r="9.5"/>
    <circle cx="584" cy="98" r="9.5"/>
  </g>
</svg>
