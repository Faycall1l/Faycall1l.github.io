ect x="250" y="307" width="440.0" height="26" fill="#6a994e"/><text x="698.0" y="326" font-family="Source Serif 4, Georgia, serif" font-size="13" fill="#333">14 of 14</text><text x="238" y="364" text-anchor="end" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#111">Fresh-context deletion (oracle)</text><rect x="250" y="347" width="440.0" height="26" fill="#6a994e"/><text x="698.0" y="366" font-family="Source Serif 4, Georgia, serif" font-size="13" fill="#333">14 of 14</text><text x="28" y="432" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#777">Pairs fully recovered under a strict clean-restoration test. Data: Shnaidman, arXiv:2609.33672. Deletion and truncation are oracle upper bounds.</text>
