<svg width="760" height="480" viewBox="0 0 760 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic trade-off between auditability and operational cost across memory substrates">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="478" rx="10" fill="#fff" stroke="#e3e3e3"/>
  <text x="28" y="38" font-family="Source Serif 4, Georgia, serif" font-size="13" letter-spacing="2" fill="#999">AUDITABILITY vs OPERATIONAL COST: SCHEMATIC</text>

  <!-- axes -->
  <line x1="90" y1="400" x2="720" y2="400" stroke="#111" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="90" y1="400" x2="90" y2="70" stroke="#111" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="710" y="428" text-anchor="end" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#555">operational cost (retrieval + maintenance, steady state)</text>
  <text x="34" y="80" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#555">auditability</text>
  <text x="34" y="98" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#555">(can answers</text>
  <text x="34" y="116" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#555">cite sources?)</text>

  <!-- pareto frontier: latent -> flat -> graph -> hierarchical -->
  <polyline points="170,330 300,120 430,100 580,70" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="596" y="66" font-family="Source Serif 4, Georgia, serif" font-size="13" font-style="italic" fill="#555">Pareto frontier</text>

  <!-- points: cx, cy, label -->
  <!-- latent -->
  <circle cx="170" cy="330" r="7" fill="#111"/>
  <text x="170" y="358" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#111">latent vectors</text>
  <!-- flat -->
  <circle cx="300" cy="120" r="7" fill="#111"/>
  <text x="300" y="148" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#111">flat token (1D)</text>
  <!-- graph -->
  <circle cx="430" cy="100" r="7" fill="#111"/>
  <text x="430" y="128" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#111">graph (2D)</text>
  <!-- hierarchical -->
  <circle cx="580" cy="70" r="7" fill="#111"/>
  <text x="580" y="98" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#111">hierarchical (3D)</text>
  <!-- adapters -->
  <circle cx="420" cy="262" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="420" y="290" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#111">adapters</text>
  <!-- parametric internal -->
  <circle cx="600" cy="345" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="600" y="373" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="12" fill="#111">parametric (weights)</text>

  <text x="28" y="436" font-family="Source Serif 4, Georgia, serif" font-size="13" font-style="italic" fill="#555">Solid dots sit on the frontier; hollow dots are dominated on both axes. Parametric factual memory costs the most and cites the least.</text>
  <text x="28" y="458" font-family="Source Serif 4, Georgia, serif" font-size="11" fill="#999">Schematic: positions are qualitative, derived from survey judgments (Hu et al. 2026, section 3). Training cost sunk, not plotted.</text>
</svg>
