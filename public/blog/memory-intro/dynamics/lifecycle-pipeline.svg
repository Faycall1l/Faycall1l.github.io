<svg width="780" height="560" viewBox="0 0 780 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Memory lifecycle: formation, evolution, and retrieval pipelines around a central memory base">
  <defs>
    <marker id="ax3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="558" rx="10" fill="#fff" stroke="#e3e3e3"/>
  <text x="28" y="38" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#999">MEMORY DYNAMICS — THE THREE PIPELINES — ORIGINAL DIAGRAM</text>

  <!-- Central memory base -->
  <rect x="290" y="220" width="200" height="120" rx="10" fill="#111"/>
  <text x="390" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#fff">Memory Base</text>
  <text x="390" y="286" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#bbb">facts, episodes, derived</text>
  <text x="390" y="304" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#bbb">items with validity windows</text>

  <!-- Formation pipeline (left) -->
  <text x="28" y="76" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#111">1. Formation</text>
  <text x="28" y="96" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#555">raw experience to memory units</text>
  <rect x="28" y="112" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="42" y="136" font-family="Georgia, serif" font-size="14" fill="#111">Summarize</text>
  <text x="42" y="155" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">incremental or partitioned</text>
  <rect x="28" y="182" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="42" y="206" font-family="Georgia, serif" font-size="14" fill="#111">Distill</text>
  <text x="42" y="225" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">facts vs strategies, never mixed</text>
  <rect x="28" y="252" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="42" y="276" font-family="Georgia, serif" font-size="14" fill="#111">Construct</text>
  <text x="42" y="295" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">entities, chunks, with provenance</text>
  <rect x="28" y="322" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="42" y="346" font-family="Georgia, serif" font-size="14" fill="#111">Adjudicate</text>
  <text x="42" y="365" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">checked before stored</text>

  <!-- Evolution pipeline (right) -->
  <text x="562" y="76" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#111">2. Evolution</text>
  <text x="562" y="96" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#555">maintain the existing store</text>
  <rect x="562" y="112" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="576" y="136" font-family="Georgia, serif" font-size="14" fill="#111">Consolidate</text>
  <text x="576" y="155" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">local, cluster, global</text>
  <rect x="562" y="182" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="576" y="206" font-family="Georgia, serif" font-size="14" fill="#111">Update</text>
  <text x="576" y="225" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">close windows, never delete</text>
  <rect x="562" y="252" width="190" height="58" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="576" y="276" font-family="Georgia, serif" font-size="14" fill="#111">Forget</text>
  <text x="576" y="295" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">time, frequency, importance</text>

  <!-- Retrieval pipeline (bottom) -->
  <text x="28" y="448" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#111">3. Retrieval</text>
  <text x="28" y="468" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#555">serve the agent backbone</text>
  <rect x="28" y="484" width="724" height="56" rx="8" fill="#f6f6f6" stroke="#999"/>
  <text x="44" y="508" font-family="Georgia, serif" font-size="13" fill="#111">Timing: always-on or autonomous</text>
  <text x="44" y="526" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">then query construction: decompose, rewrite, route</text>
  <text x="430" y="508" font-family="Georgia, serif" font-size="13" fill="#111">Strategy: lexical, semantic, graph, hybrid</text>
  <text x="430" y="526" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#555">then post-processing: rerank, filter, cite spans</text>

  <!-- Connecting arrows -->
  <line x1="218" y1="260" x2="282" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#ax3)"/>
  <line x1="498" y1="260" x2="562" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#ax3)"/>
  <path d="M 360 340 L 360 416 L 280 416 L 280 480" stroke="#555" stroke-width="1.5" marker-end="url(#ax3)"/>
  <text x="24" y="552" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#999">Adapted from Figure 8 of Hu et al. (2026), CC BY 4.0. Detail levels are the survey's own.</text>
</svg>
