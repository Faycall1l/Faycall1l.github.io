    <text x="722" y="222" fill="#bbb">○</text>
    <text x="392" y="292" fill="#777">◐</text>
    <text x="462" y="292" fill="#777">◐</text>
    <text x="532" y="292" fill="#777">◐</text>
    <text x="602" y="292" fill="#bbb">○</text>
